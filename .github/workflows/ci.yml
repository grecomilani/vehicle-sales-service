name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, testes e cobertura (mínimo 80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Histórico completo: o SonarQube Cloud usa o blame para identificar código novo
          fetch-depth: 0

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, testes e verificação de cobertura
        run: ./mvnw -B verify

      - name: Resumo da cobertura
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "Relatório de cobertura não encontrado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
            END {
              lt = lm + lc; bt = bm + bc
              printf "## Cobertura de testes (JaCoCo)\n\n"
              printf "| Métrica | Cobertos | Total | %% |\n|---|---|---|---|\n"
              printf "| Linhas | %d | %d | %.2f%% |\n", lc, lt, (lt ? lc * 100 / lt : 100)
              printf "| Branches | %d | %d | %.2f%% |\n", bc, bt, (bt ? bc * 100 / bt : 100)
              printf "\nMínimo exigido: **80%%** de linhas.\n"
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      # Análise estática e cobertura no SonarQube Cloud. Roda em pull requests e
      # nos pushes em develop/main; o push em feature/* é coberto pelo PR aberto
      # automaticamente, evitando análise duplicada.
      - name: Cache do SonarQube
        if: github.event_name != 'push' || !startsWith(github.ref_name, 'feature/')
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Análise SonarQube Cloud
        if: github.event_name != 'push' || !startsWith(github.ref_name, 'feature/')
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=grecomilani
            -Dsonar.projectKey=grecomilani_vehicle-sales-service
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
            -Dsonar.java.libraries=/home/runner/.m2/repository/**/*.jar
            -Dsonar.java.source=25
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.coverage.exclusions=**/VehicleSalesServiceApplication.java

  docker-image:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build da imagem
        run: docker build -t ${{ github.event.repository.name }}:ci .

  k8s-manifests:
    name: Validação dos manifests Kubernetes
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
      # SHA-256 do kubeconform-linux-amd64.tar.gz da versão acima (arquivo CHECKSUMS da release)
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar kubeconform
        run: |
          # Somente HTTPS (inclusive nos redirecionamentos) e checksum conferido antes de extrair
          curl --proto '=https' --tlsv1.2 -sSfLo "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C /usr/local/bin kubeconform

      - name: Renderizar (kustomize) e validar contra os schemas do Kubernetes
        run: kubectl kustomize k8s | kubeconform -strict -summary -

  # Git Flow automatizado: depois que todos os jobs de verificação passam,
  # abre o Pull Request
  #   feature/*  -> develop
  #   develop    -> main (release)
  # O pipeline não faz merge: o merge é sempre manual, pelo GitHub.
  auto-pull-request:
    name: Abrir Pull Request
    needs: [build-and-test, docker-image, k8s-manifests]
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref_name, 'feature/') || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # PR_AUTOMATION_TOKEN: PAT do dono do repositório. PRs abertos com o
      # GITHUB_TOKEN padrão não disparam workflows, então sem este token os
      # checks do próprio PR não rodariam.
      GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}
      HAS_PAT: ${{ secrets.PR_AUTOMATION_TOKEN != '' }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Abrir PR
        run: |
          if [ "$HEAD_BRANCH" = "develop" ]; then
            BASE_BRANCH=main
            TITLE="Release: develop -> main"
          else
            BASE_BRANCH=develop
            TITLE="${HEAD_BRANCH}"
          fi

          PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "PR #$PR_NUMBER já aberto de $HEAD_BRANCH para $BASE_BRANCH."
          else
            AHEAD_BY=$(gh api "repos/$GH_REPO/compare/$BASE_BRANCH...$HEAD_BRANCH" --jq '.ahead_by')
            if [ "$AHEAD_BY" = "0" ]; then
              echo "$HEAD_BRANCH não tem commits novos em relação a $BASE_BRANCH. Nada a fazer."
              exit 0
            fi

            COMMITS=$(gh api "repos/$GH_REPO/compare/$BASE_BRANCH...$HEAD_BRANCH" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0])')

            BODY=$(printf 'PR aberto automaticamente pelo pipeline de CI (Git Flow).\n\n**%s** -> **%s**\n\n### Commits\n%s\n\n### Checklist\n- [ ] CHANGELOG.md atualizado\n- [ ] Build, testes e cobertura (mínimo 80%%) verdes\n\n> O merge é manual: revise e faça o merge pelo GitHub quando os checks estiverem verdes.\n' \
              "$HEAD_BRANCH" "$BASE_BRANCH" "$COMMITS")

            if ! PR_URL=$(gh pr create --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --title "$TITLE" --body "$BODY"); then
              if [ "$HAS_PAT" = "true" ]; then
                echo "::error::Não foi possível criar o PR com o PR_AUTOMATION_TOKEN. Verifique se o token tem acesso a este repositório e as permissões Contents, Pull requests e Workflows (Read and write), e se não expirou."
              else
                echo "::error::Não foi possível criar o PR com o GITHUB_TOKEN. Habilite em Settings > Actions > General > Workflow permissions a opção 'Allow GitHub Actions to create and approve pull requests', ou configure o secret PR_AUTOMATION_TOKEN."
              fi
              exit 1
            fi
            PR_NUMBER="${PR_URL##*/}"
            echo "PR #$PR_NUMBER criado: $PR_URL"
          fi

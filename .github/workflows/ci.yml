name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, testes e cobertura (mínimo 80%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, testes e verificação de cobertura
        run: ./mvnw -B verify

      - name: Resumo da cobertura
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "Relatório de cobertura não encontrado." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
            END {
              lt = lm + lc; bt = bm + bc
              printf "## Cobertura de testes (JaCoCo)\n\n"
              printf "| Métrica | Cobertos | Total | %% |\n|---|---|---|---|\n"
              printf "| Linhas | %d | %d | %.2f%% |\n", lc, lt, (lt ? lc * 100 / lt : 100)
              printf "| Branches | %d | %d | %.2f%% |\n", bc, bt, (bt ? bc * 100 / bt : 100)
              printf "\nMínimo exigido: **80%%** de linhas.\n"
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  # Git Flow automatizado: com o build verde, abre o Pull Request e habilita
  # o merge automático
  #   feature/*  -> develop
  #   develop    -> main (release)
  # O merge acontece quando todos os checks obrigatórios do PR estiverem verdes.
  # Para segurar um PR (ex.: revisão manual), adicione a label "hold".
  auto-pull-request:
    name: Abrir Pull Request e merge automático
    needs: build-and-test
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref_name, 'feature/') || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # PR_AUTOMATION_TOKEN: PAT do dono do repositório. É necessário para o
      # fluxo completo: merges feitos com o GITHUB_TOKEN padrão não disparam
      # novos workflows, então o merge na develop não abriria a release.
      GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN || github.token }}
      HAS_PAT: ${{ secrets.PR_AUTOMATION_TOKEN != '' }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Abrir PR e habilitar merge automático
        run: |
          if [ "$HEAD_BRANCH" = "develop" ]; then
            BASE_BRANCH=main
            TITLE="Release: develop -> main"
          else
            BASE_BRANCH=develop
            TITLE="${HEAD_BRANCH}"
          fi

          PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -n "$PR_NUMBER" ]; then
            echo "PR #$PR_NUMBER já aberto de $HEAD_BRANCH para $BASE_BRANCH."
          else
            AHEAD_BY=$(gh api "repos/$GH_REPO/compare/$BASE_BRANCH...$HEAD_BRANCH" --jq '.ahead_by')
            if [ "$AHEAD_BY" = "0" ]; then
              echo "$HEAD_BRANCH não tem commits novos em relação a $BASE_BRANCH. Nada a fazer."
              exit 0
            fi

            COMMITS=$(gh api "repos/$GH_REPO/compare/$BASE_BRANCH...$HEAD_BRANCH" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0])')

            BODY=$(printf 'PR aberto automaticamente pelo pipeline de CI (Git Flow).\n\n**%s** -> **%s**\n\n### Commits\n%s\n\n### Checklist\n- [ ] CHANGELOG.md atualizado\n- [ ] Build, testes e cobertura (mínimo 80%%) verdes\n\n> Merge automático habilitado. Para segurar este PR, adicione a label `hold`.\n' \
              "$HEAD_BRANCH" "$BASE_BRANCH" "$COMMITS")

            if ! PR_URL=$(gh pr create --base "$BASE_BRANCH" --head "$HEAD_BRANCH" --title "$TITLE" --body "$BODY"); then
              if [ "$HAS_PAT" = "true" ]; then
                echo "::error::Não foi possível criar o PR com o PR_AUTOMATION_TOKEN. Verifique se o token tem acesso a este repositório e as permissões Contents, Pull requests e Workflows (Read and write), e se não expirou."
              else
                echo "::error::Não foi possível criar o PR com o GITHUB_TOKEN. Habilite em Settings > Actions > General > Workflow permissions a opção 'Allow GitHub Actions to create and approve pull requests', ou configure o secret PR_AUTOMATION_TOKEN."
              fi
              exit 1
            fi
            PR_NUMBER="${PR_URL##*/}"
            echo "PR #$PR_NUMBER criado: $PR_URL"
          fi

          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' | grep -qx 'hold'; then
            echo "PR #$PR_NUMBER está com a label 'hold'. Merge automático não habilitado."
            exit 0
          fi

          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::Secret PR_AUTOMATION_TOKEN não configurado: o merge será feito com o GITHUB_TOKEN e não disparará o pipeline da branch de destino."
          fi

          # Com checks pendentes, o GitHub agenda o merge (auto-merge); se o PR já
          # estiver pronto, o merge é feito na hora. Logo após a criação do PR, o
          # check do próprio PR ainda pode estar sendo registrado e o GitHub recusa
          # a operação: por isso há novas tentativas.
          for attempt in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUMBER" --json state,autoMergeRequest \
              --jq '.state + (if .autoMergeRequest then "+auto" else "" end)')
            case "$STATE" in
              MERGED*) echo "PR #$PR_NUMBER mergeado."; exit 0 ;;
              CLOSED*) echo "PR #$PR_NUMBER foi fechado sem merge. Nada a fazer."; exit 0 ;;
              *+auto) echo "Merge automático habilitado no PR #$PR_NUMBER."; exit 0 ;;
            esac

            if gh pr merge "$PR_NUMBER" --auto --merge; then
              continue
            fi
            echo "Tentativa $attempt de 30 não concluída; nova tentativa em 20s."
            sleep 20
          done

          echo "::error::Não foi possível fazer o merge do PR #$PR_NUMBER. Verifique se 'Allow auto-merge' está habilitado em Settings > General e se os checks obrigatórios passaram."
          exit 1

# PostgreSQL exclusivo do vehicle-sales-service: nenhum outro serviço acessa este banco.
apiVersion: v1
kind: Secret
metadata:
  name: vehicle-sales-db-credentials
type: Opaque
stringData:
  # Credenciais de demonstração; em produção, use um gerenciador de segredos.
  POSTGRES_DB: vehicle_sales
  POSTGRES_USER: vehicle_sales
  POSTGRES_PASSWORD: vehicle_sales
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-sales-db
spec:
  selector:
    app.kubernetes.io/name: vehicle-sales-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vehicle-sales-db
spec:
  serviceName: vehicle-sales-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vehicle-sales-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vehicle-sales-db
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: vehicle-sales-db-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

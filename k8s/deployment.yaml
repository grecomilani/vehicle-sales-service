apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-sales-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vehicle-sales-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vehicle-sales-service
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        # Aguarda o banco aceitar conexões antes de iniciar a aplicação
        # (evita reinícios por falha do Flyway na inicialização)
        - name: wait-for-database
          image: postgres:17-alpine
          command: ["sh", "-c", "until pg_isready -h \"$DB_HOST\" -p \"$DB_PORT\"; do echo 'aguardando o banco...'; sleep 2; done"]
          envFrom:
            - configMapRef:
                name: vehicle-sales-service-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      containers:
        - name: vehicle-sales-service
          image: ghcr.io/grecomilani/vehicle-sales-service
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: vehicle-sales-service-config
          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: vehicle-sales-db-credentials
                  key: POSTGRES_DB
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vehicle-sales-db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vehicle-sales-db-credentials
                  key: POSTGRES_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi

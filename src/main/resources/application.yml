spring:
  application:
    name: vehicle-sales-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:vehicle_sales}
    username: ${DB_USERNAME:vehicle_sales}
    password: ${DB_PASSWORD:vehicle_sales}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  web:
    # Mensagens de validação sempre em português
    locale: pt_BR
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: vehicle-sales-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:vehicle_sales}
    username: ${DB_USERNAME:vehicle_sales}
    password: ${DB_PASSWORD:vehicle_sales}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  web:
    # Mensagens de validação sempre em português
    locale: pt_BR
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8081}

app:
  # Fuso horário da revenda, usado nas regras que dependem da data atual
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

api:
  version: '@project.version@'

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
